<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduTwin — AI-Powered Digital Student Twin</title>
  <meta name="description" content="Understand yourself. Improve your skills. Build your future with your personal AI digital twin.">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#4F46E5',
            secondary: '#7C3AED',
            accent: '#14B8A6',
            surface: '#FFFFFF',
            darkSurface: '#111827',
            navy: '#0F172A',
            slateDark: '#0B1120',
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Canvas Confetti for celebrations -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <!-- App Custom Styles -->
  <link rel="stylesheet" href="/styles/app.css">
</head>
<body class="bg-[#F8FAFC] dark:bg-[#0B1120] text-[#0F172A] dark:text-[#F8FAFC] min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- App Root Mount Point -->
  <div id="app" class="min-h-screen flex flex-col flex-1"></div>

  <!-- Main JavaScript App -->
  <script type="module" src="/app.js"></script>
</body>
</html>
